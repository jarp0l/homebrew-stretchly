name: CI

on:
  push:
    branches: [trunk]
    paths:
      - "Casks/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Casks/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Run brew test-bot --only-tap-syntax
        run: brew test-bot --only-tap-syntax

      - name: Audit cask
        run: brew audit --cask --online hovancik/stretchly/stretchly

      - name: Install cask
        run: brew install --cask hovancik/stretchly/stretchly

      - name: Verify app exists
        run: test -d "/Applications/Stretchly.app"

      - name: Uninstall cask
        run: brew uninstall --cask hovancik/stretchly/stretchly
